autoInstallPeers: true

allowBuilds:
  '@heroui/shared-utils': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

overrides:
  '@xmldom/xmldom': '>=0.8.15 <0.9.0'
  brace-expansion@2: '>=2.1.2 <3.0.0'
  brace-expansion@5: '>=5.0.7 <6.0.0'
  browserslist: '>=4.28.7 <5.0.0'
  fast-uri: '>=3.1.6 <4.0.0'
  ip-address: '>=10.3.1 <11.0.0'
  langsmith: '>=0.6.0'
  path-to-regexp: '>=8.4.0'
  undici: '>=7.29.0 <8.0.0'
  ws@7: '>=7.5.11 <8.0.0'

savePrefix: ''

shamefullyHoist: true

shellEmulator: true

minimumReleaseAgeExclude:
  - '@bfra.me/prettier-config@0.16.10 || 0.16.11 || 0.16.13'
  - '@bfra.me/tsconfig@0.13.2'
